<ion-header>
  <ion-toolbar>
    <ion-title>Open-Meteo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="controls">
    <label>
      Latitude
      <input #lat type="number" [value]="defaultLat" min="-90" max="90" step="0.0001" />
    </label>
    <label>
      Longitude
      <input #lon type="number" [value]="defaultLon" min="-180" max="180" step="0.0001" />
    </label>
    <ion-button expand="block" (click)="fetch(lat.value, lon.value)">Buscar</ion-button>
  </div>

  <div *ngIf="loading" class="loading">
    <ion-spinner name="crescent"></ion-spinner>
    <span>Carregando...</span>
  </div>

  
  <ion-card *ngIf="current">
    <ion-card-content>
      <h3>Temperatura: {{ current.temperature }} °C</h3>
      <p>Vento: {{ current.windspeed }} m/s</p>
      <p>Direção do vento: {{ current.winddirection }}°</p>
      <p>Hora: {{ current.time }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
